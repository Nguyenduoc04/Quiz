<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tham gia phòng thi - Quiz CodeGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }

        .join-card { background: white; border-radius: 24px; padding: 2.5rem 2rem; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; }
        .icon-badge { width: 64px; height: 64px; background: #e0e7ff; color: #4f46e5; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1rem; }
        .join-title { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 0.4rem; }
        .join-desc { font-size: 0.88rem; color: #64748b; margin-bottom: 1.8rem; }

        .pin-input {
            width: 100%; font-family: monospace; font-size: 1.8rem; font-weight: 800; letter-spacing: 6px;
            text-align: center; padding: 0.8rem; border: 2px solid #cbd5e1; border-radius: 12px; outline: none;
            transition: all 0.2s; color: #1e293b; text-transform: uppercase;
        }
        .pin-input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15); }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-label { font-size: 0.82rem; font-weight: 700; color: #475569; margin-bottom: 0.4rem; display: block; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; }

        .btn-join {
            width: 100%; background: #667eea; color: white; border: none; padding: 0.9rem;
            border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 1rem;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-join:hover { background: #5a67d8; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="join-card">
    <div class="icon-badge">
        <i class="bi bi-broadcast"></i>
    </div>
    <h1 class="join-title">Tham gia phòng thi</h1>
    <p class="join-desc">Nhập mã PIN do giáo viên cung cấp để vào phòng chờ</p>

    <div th:if="${errorMessage}" style="background:#fee2e2; color:#b91c1c; padding:0.8rem; border-radius:10px; font-weight:600; font-size:0.85rem; margin-bottom:1rem;" th:text="${errorMessage}">
        Mã phòng thi không tồn tại
    </div>

    <form th:action="@{/user/join-room}" method="post">
        <div class="form-group">
            <label class="form-label">MÃ PHÒNG (ROOM PIN)</label>
            <input type="text" name="pin" class="pin-input" placeholder="889-204" maxlength="7" required autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">HỌ VÀ TÊN HỌC VIÊN</label>
            <input type="text" name="studentName" class="form-control" th:value="${userFullName} ?: 'Trần Văn An'" placeholder="Nhập tên của bạn..." required>
        </div>

        <button type="submit" class="btn-join">
            <i class="bi bi-box-arrow-in-right"></i> Vào phòng chờ
        </button>
    </form>
</div>

</body>
</html>
