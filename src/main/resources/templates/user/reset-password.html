<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Quiz App</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 py-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-success text-white text-center py-3 rounded-top">
                    <h4 class="mb-0 fs-5 fw-bold"><i class="bi bi-shield-check me-2"></i>XÁC NHẬN OTP & ĐỔI MẬT KHẨU</h4>
                </div>
                <div class="card-body p-4">

                    <!-- Thông báo lỗi / thành công từ Controller -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                    </div>

                    <form th:action="@{/user/reset-password}" th:object="${resetPasswordDTO}" method="post" class="needs-validation" novalidate>

                        <!-- Email ẩn để duy trì dữ liệu khi POST -->
                        <input type="hidden" th:field="*{email}" />

                        <!-- Mã OTP -->
                        <div class="mb-3">
                            <label for="otp" class="form-label fw-semibold">Mã OTP (6 chữ số): <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                <input type="text" id="otp" th:field="*{otp}" class="form-control text-center letter-spacing-2"
                                       placeholder="123456" maxlength="6" inputmode="numeric" pattern="\d{6}"
                                       th:classappend="${#fields.hasErrors('otp')} ? 'is-invalid'" required>
                            </div>
                            <div class="invalid-feedback d-block mt-1" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới: <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                                       placeholder="Nhập mật khẩu mới" minlength="6"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" required>
                            </div>
                            <div class="invalid-feedback d-block mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới: <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                       placeholder="Nhập lại mật khẩu mới" minlength="6"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required>
                            </div>
                            <div class="invalid-feedback d-block mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-success py-2 fw-semibold fs-6">
                                <i class="bi bi-check-circle me-1"></i> Cập nhật mật khẩu
                            </button>
                        </div>

                        <!-- Link quay lại -->
                        <div class="text-center">
                            <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
