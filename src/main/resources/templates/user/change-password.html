<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold fs-5"><i class="bi bi-key-fill me-2"></i>Đổi Mật Khẩu</h4>
        </div>
        <div class="card-body p-4">

            <!-- Thông báo thành công / thất bại từ Controller -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/user/change-password}" th:object="${changePasswordDTO}" method="post">

                <!-- Mật khẩu hiện tại -->
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control" placeholder="Nhập mật khẩu hiện tại" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <!-- Mật khẩu mới -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Nhập mật khẩu mới" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>

                <!-- Xác nhận mật khẩu mới -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a th:href="@{/user/profile}" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-1"></i> Hủy</a>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Lưu mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
