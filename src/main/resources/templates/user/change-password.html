<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Quiz CodeGym</title>
    <!-- Bootstrap 5 CSS & Icons & Custom Style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .pass-card {
            background: #ffffff;
            border-radius: var(--radius-lg, 20px);
            border: 1px solid var(--border-color, #e2e8f0);
            box-shadow: var(--shadow-md, 0 4px 15px rgba(0,0,0,0.04));
            padding: 2.2rem;
            max-width: 520px;
            margin: 2.5rem auto;
        }
        .pass-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 1.2rem;
        }
        .pass-header-icon {
            width: 64px;
            height: 64px;
            background: var(--primary-light, #e0e7ff);
            color: var(--primary, #4f46e5);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
        }
        .pass-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main, #0f172a);
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4 flex-grow-1">
        <div class="pass-card">
            <div class="pass-header">
                <div class="pass-header-icon">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h1 class="pass-title">Đổi Mật Khẩu</h1>
                <p class="text-muted small mb-0">Cập nhật mật khẩu mới để tăng cường bảo mật tài khoản</p>
            </div>

            <!-- Thông báo thành công / thất bại -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2.5 small rounded-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success py-2.5 small rounded-3" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/user/change-password}" th:object="${changePasswordDTO}" method="post">

                <!-- Mật khẩu hiện tại -->
                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-bold small text-secondary">MẬT KHẨU HIỆN TẠI</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill text-secondary"></i></span>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control" placeholder="Nhập mật khẩu hiện tại" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <!-- Mật khẩu mới -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-bold small text-secondary">MẬT KHẨU MỚI</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock text-secondary"></i></span>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Nhập mật khẩu mới" required minlength="6">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>

                <!-- Xác nhận mật khẩu mới -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-bold small text-secondary">XÁC NHẬN MẬT KHẨU MỚI</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-check text-secondary"></i></span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu mới" required minlength="6">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex justify-content-between gap-3 pt-2">
                    <a th:href="@{/user/profile}" class="btn-outline-custom px-4"><i class="bi bi-arrow-left"></i> Hủy</a>
                    <button type="submit" class="btn-indigo px-4"><i class="bi bi-check-lg"></i> Lưu mật khẩu</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
