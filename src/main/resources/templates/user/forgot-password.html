<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0 fw-bold fs-5"><i class="bi bi-key me-2"></i>QUÊN MẬT KHẨU</h4>
                </div>
                <div class="card-body p-4">

                    <!-- Thông báo lỗi hệ thống/logic -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Thông báo thành công -->
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                    </div>

                    <form id="forgotPasswordForm" th:action="@{/user/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Nhập Email tài khoản của bạn:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control"
                                       placeholder="example@gmail.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                            </div>
                            <div class="invalid-feedback d-block mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-send me-1"></i> Gửi mã OTP
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script tạo hiệu ứng Loading khi bấm gửi OTP -->
<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang gửi OTP...';
    });
</script>

</body>
</html>
