<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử lý Nộp bài - Quiz CodeGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }

        /* MODAL KHI HẾT GIỜ */
        .timeout-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 24px;
            padding: 2.5rem; max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;
        }

        .timeout-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #ef4444, #f59e0b);
        }

        .icon-pulse {
            width: 80px; height: 80px; background: rgba(239, 68, 68, 0.15); color: #ef4444;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 0 auto 1.5rem; animation: pulseAlert 1.5s infinite;
        }

        @keyframes pulseAlert {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .timeout-title { font-size: 1.5rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.5rem; }
        .timeout-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 2rem; line-height: 1.5; }

        /* PROGRESS SYNC ANIMATION */
        .sync-box { background: #0f172a; border-radius: 14px; padding: 1.2rem; border: 1px solid #334155; margin-bottom: 1.5rem; }
        .sync-status { font-size: 0.85rem; font-weight: 600; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.8rem; }

        .progress-bar-bg { width: 100%; height: 8px; background: #334155; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #38bdf8); width: 0%; transition: width 0.3s ease; border-radius: 10px; }

        .info-pills { display: flex; justify-content: space-around; font-size: 0.82rem; color: #cbd5e1; border-top: 1px solid #334155; padding-top: 1rem; }
        .info-pills strong { color: #f8fafc; font-weight: 700; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 50%; border-top-color: #38bdf8; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="timeout-card">
    <div class="icon-pulse">
        <i class="bi bi-alarm-fill"></i>
    </div>

    <h2 class="timeout-title">Đã hết giờ làm bài!</h2>
    <p class="timeout-desc">Hệ thống đang tiến hành khóa bài thi và thu lại các câu trả lời của bạn.</p>

    <div class="sync-box">
        <div class="sync-status">
            <span class="spinner"></span>
            <span id="statusText">Đang đóng gói dữ liệu đáp án...</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="info-pills">
        <div>Đã trả lời: <strong id="answeredCount">18/20</strong></div>
        <div>Bỏ trống: <strong id="unansweredCount" style="color: #f87171;">2</strong></div>
    </div>
</div>

<script>
    // Tự động chạy tiến trình nộp bài giả lập UI
    let progress = 0;
    const fill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');

    const interval = setInterval(() => {
        progress += 25;
        fill.style.width = progress + '%';

        if (progress === 50) {
            statusText.innerText = "Đang đồng bộ kết quả với máy chủ...";
        } else if (progress === 75) {
            statusText.innerText = "Đang tính toán điểm số...";
        } else if (progress >= 100) {
            clearInterval(interval);
            statusText.innerText = "Hoàn tất! Đang chuyển hướng...";
            setTimeout(() => {
                // Chuyển hướng tới màn hình Kết quả & Bảng xếp hạng (Ngày 10)
                window.location.href = '/user/online-result';
            }, 800);
        }
    }, 600);
</script>
</body>
</html>
