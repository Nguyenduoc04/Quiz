<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4">
                        <h3 class="text-center fw-bold mb-4 text-primary">Đăng Nhập</h3>

                        <!-- Alert thông báo thành công / thất bại -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> Tên đăng nhập hoặc mật khẩu không chính
                            xác!
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                            <i class="bi bi-check-circle-fill me-1"></i> Bạn đã đăng xuất thành công.
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
                            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                        </div>

                        <!-- Form Đăng Nhập -->
                        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" id="username" name="username" class="form-control"
                                        placeholder="Nhập username" required />
                                    <div class="invalid-feedback">Vui lòng nhập tên đăng nhập.</div>
                                </div>
                            </div>

                            <!-- Password với nút Ẩn/Hiện -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control"
                                        placeholder="Nhập mật khẩu" required />
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                    </button>
                                    <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
                                </div>
                            </div>

                            <!-- Remember Me & Quên mật khẩu -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                    <label class="form-check-label small" for="remember-me">Ghi nhớ đăng nhập</label>
                                </div>
                                <a th:href="@{/user/forgot-password}" class="text-decoration-none small">Quên mật
                                    khẩu?</a>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fs-6">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                                </button>
                            </div>

                            <!-- Link đăng ký & Quay về trang chủ -->
                            <div class="text-center small">
                                Chưa có tài khoản? <a th:href="@{/user/register}"
                                    class="text-decoration-none fw-bold me-2">Đăng ký ngay</a>
                            </div>
                            <div class="d-grid mt-3">
                                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
                                    <i class="bi bi-house-door me-1"></i> Quay về Trang chủ
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict';
            // Validation JS
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });

            // Ẩn / Hiện Mật khẩu
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (togglePassword && password && toggleIcon) {
                togglePassword.addEventListener('click', function () {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    toggleIcon.classList.toggle('bi-eye');
                    toggleIcon.classList.toggle('bi-eye-slash');
                });
            }
        })();
    </script>
</body>

</html>
