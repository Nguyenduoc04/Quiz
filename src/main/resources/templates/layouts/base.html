<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Quiz CodeGym'">Quiz App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
            --bg-body: #f0f4f8;
            --text-main: #1a1a2e;
            --badge-admin-bg: #fde8e8; --badge-admin-color: #c0392b;
            --badge-student-bg: #e8f5e9; --badge-student-color: #2e7d32;
            --badge-user-bg: #e8f0fe; --badge-user-color: #3949ab;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); min-height: 100vh; display: flex; flex-direction: column; }

        /* ── Navbar Styling ── */
        nav { background: var(--primary-gradient); padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 2px 12px rgba(102, 126, 234, 0.4); }
        .sidebar-logo a { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; color: #ffffff; text-decoration: none; }
        .sidebar-logo i { font-size: 28px; color: #f59e0b; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }

        /* Dropdown */
        .user-dropdown { position: relative; display: inline-block; }
        .user-dropdown-btn { background: rgba(255, 255, 255, 0.18); color: white; border: 1px solid rgba(255, 255, 255, 0.35); padding: 0.5rem 1rem; border-radius: 25px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; }
        .user-dropdown-btn:hover, .user-dropdown:hover .user-dropdown-btn { background: rgba(255, 255, 255, 0.3); }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; padding-top: 8px; min-width: 210px; z-index: 1000; }
        .dropdown-menu-content { background-color: white; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); border-radius: 12px; overflow: hidden; }
        .user-dropdown:hover .dropdown-menu { display: block; }
        .dropdown-item { color: #333; padding: 0.75rem 1.2rem; text-decoration: none; display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; border: 0 !important; outline: none; width: 100%; text-align: left; cursor: pointer; }
        .dropdown-item:hover { background-color: #f4f6fb; color: #667eea; }
        .dropdown-divider { height: 1px; background-color: #eee; margin: 0; }
        .dropdown-item.logout-btn { color: #e74c3c; }
        .dropdown-item.logout-btn:hover { background-color: #fde8e8; color: #c0392b; }

        /* Container & Badges */
        .container { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
        .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600; }
        .badge-admin { background: var(--badge-admin-bg); color: var(--badge-admin-color); border: 1px solid #f5c6cb; }
        .badge-student { background: var(--badge-student-bg); color: var(--badge-student-color); border: 1px solid #c8e6c9; }
        .badge-user { background: var(--badge-user-bg); color: var(--badge-user-color); border: 1px solid #c5cae9; }
        .badge-default { background: #f5f5f5; color: #666; border: 1px solid #ddd; }

        /* Footer */
        footer { background: #ffffff; text-align: center; padding: 1.2rem; margin-top: auto; border-top: 1px solid #e2e8f0; color: #666; font-size: 0.88rem; }
    </style>
</head>
<body>

<!-- Insert Navbar Fragment -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Main Content Dynamic Area -->
<main class="container">
    <th:block th:replace="${content}" />
</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Quiz CodeGym. Hệ thống luyện thi & Đánh giá năng lực.</p>
</footer>

</body>
</html>
