<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý học viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Quản lý học viên</h2>
                    <p class="text-muted mb-0">
                        Tổng số học viên:
                        <strong th:text="${totalItems}">0</strong>
                    </p>
                </div>

                <a th:href="@{/admin/dashboard}"
                   class="btn btn-outline-secondary">
                    Quay lại Dashboard
                </a>
            </div>

            <div th:if="${#lists.isEmpty(students)}"
                 class="alert alert-info">
                Chưa có học viên nào.
            </div>

            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(students)}">

                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>STT</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student, status : ${students}">
                        <td th:text="${currentPage * pageSize + status.index + 1}">
                            1
                        </td>

                        <td th:text="${student.username}">
                            username
                        </td>

                        <td th:text="${student.fullName != null
                                      ? student.fullName
                                      : 'Chưa cập nhật'}">
                            Nguyễn Văn A
                        </td>

                        <td th:text="${student.email}">
                            email@example.com
                        </td>

                        <td>
                            <span th:if="${student.enabled}"
                                  class="badge bg-success">
                                Hoạt động
                            </span>

                            <span th:unless="${student.enabled}"
                                  class="badge bg-danger">
                                Bị khóa
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">

                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/students(
                               page=${currentPage - 1},
                               size=${pageSize}
                           )}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${pageNumber == currentPage} ? 'active'">

                        <a class="page-link"
                           th:href="@{/admin/students(
                               page=${pageNumber},
                               size=${pageSize}
                           )}"
                           th:text="${pageNumber + 1}">
                            1
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/students(
                               page=${currentPage + 1},
                               size=${pageSize}
                           )}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>

</body>
</html>
