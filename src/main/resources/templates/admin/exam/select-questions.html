<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chọn Câu Hỏi Cho Đề Thi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header('Chọn câu hỏi cho bài thi', ${exam.title})}"></div>

    <main class="admin-content p-4">
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-3">
                <form th:action="@{/admin/exams/{id}/questions(id=${exam.id})}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-9">
                        <select name="categoryId" class="form-select">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i> Lọc câu hỏi</button>
                        <a th:href="@{/admin/exams/{id}/questions(id=${exam.id})}" class="btn btn-outline-secondary">Đặt lại</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-bold">Danh sách câu hỏi khả dụng</h5>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/admin/exams/{id}/questions(id=${exam.id})}" method="post">
                    <div class="list-group mb-4">
                        <label th:each="q : ${questions}" class="list-group-item d-flex gap-3 py-3">
                            <input class="form-check-input flex-shrink-0" type="checkbox" name="questionIds" th:value="${q.id}" th:checked="${selectedQuestionIds != null and selectedQuestionIds.contains(q.id)}" style="font-size: 1.2em;">
                            <span class="pt-1">
                                <strong class="d-block text-dark mb-1" th:text="${q.content}">Nội dung câu hỏi?</strong>
                                <small class="text-muted" th:text="${q.category != null ? q.category.name : ''}">Danh mục</small>
                            </span>
                        </label>
                        <div th:if="${#lists.isEmpty(questions)}" class="text-center py-4 text-muted">
                            Không tìm thấy câu hỏi phù hợp.
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/exams}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Lưu danh sách câu hỏi</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
