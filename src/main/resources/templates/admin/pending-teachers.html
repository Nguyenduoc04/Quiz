<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Duyệt Giáo Viên - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header('Duyệt Giáo Viên', 'Xem và phê duyệt các tài khoản đăng ký làm giáo viên')}"></div>

    <main class="admin-content p-4">
        <!-- Notification Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold">Yêu Cầu Chờ Duyệt</h4>
                        <p class="text-muted mb-0">Danh sách học viên yêu cầu nâng cấp tài khoản Giáo viên</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">ID</th>
                            <th>Họ và Tên</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Trạng Thái</th>
                            <th style="width: 200px;" class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${pendingTeachers}">
                            <td class="fw-bold" th:text="${u.id}">1</td>
                            <td th:text="${u.fullName != null ? u.fullName : 'N/A'}">Nguyễn Văn A</td>
                            <td><code th:text="${u.username}">username</code></td>
                            <td th:text="${u.email}">email@example.com</td>
                            <td>
                                <span class="badge bg-warning text-dark">⌛ Chờ duyệt</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <form th:action="@{/admin/users/{id}/approve-teacher(id=${u.id})}" method="post" class="m-0">
                                        <input type="hidden" name="redirectUrl" value="/admin/teachers/pending" />
                                        <button type="submit" class="btn btn-sm btn-success" onclick="return confirm('Bạn có chắc chắn muốn duyệt tài khoản này thành Giáo viên?')">
                                            <i class="bi bi-check-circle me-1"></i> Duyệt
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/reject-teacher(id=${u.id})}" method="post" class="m-0">
                                        <input type="hidden" name="redirectUrl" value="/admin/teachers/pending" />
                                        <button type="submit" class="btn btn-sm btn-outline-warning" onclick="return confirm('Bạn có chắc chắn muốn từ chối yêu cầu Đăng ký Giáo viên?')">
                                            <i class="bi bi-x-circle me-1"></i> Từ chối
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pendingTeachers)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                Hiện tại không có yêu cầu duyệt giáo viên nào!
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
