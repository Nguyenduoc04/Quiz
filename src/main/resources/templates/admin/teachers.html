<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý giáo viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <!-- Tiêu đề -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Quản lý giáo viên</h2>

                    <p class="text-muted mb-0">
                        Tổng số kết quả:
                        <strong th:text="${totalItems}">0</strong>
                    </p>
                </div>

                <a th:href="@{/admin/dashboard}"
                   class="btn btn-outline-secondary">
                    Quay lại Dashboard
                </a>
            </div>

            <!-- Form tìm kiếm -->
            <form th:action="@{/admin/teachers}"
                  method="get"
                  class="row g-2 mb-4">

                <div class="col-md-8">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Tìm theo tên đăng nhập, họ tên hoặc email..."
                           th:value="${keyword}">
                </div>

                <div class="col-md-2">
                    <button type="submit"
                            class="btn btn-primary w-100">
                        Tìm kiếm
                    </button>
                </div>

                <div class="col-md-2">
                    <a th:href="@{/admin/teachers}"
                       class="btn btn-secondary w-100">
                        Đặt lại
                    </a>
                </div>
            </form>

            <!-- Hiển thị từ khóa -->
            <div class="alert alert-secondary"
                 th:if="${keyword != null and !#strings.isEmpty(keyword)}">

                Kết quả tìm kiếm cho:
                <strong th:text="${keyword}"></strong>
            </div>

            <!-- Không có dữ liệu -->
            <div th:if="${#lists.isEmpty(teachers)}"
                 class="alert alert-info">

                <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">
                    Không tìm thấy giáo viên phù hợp.
                </span>

                <span th:unless="${keyword != null and !#strings.isEmpty(keyword)}">
                    Chưa có giáo viên nào.
                </span>
            </div>

            <!-- Bảng dữ liệu -->
            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(teachers)}">

                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>STT</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="teacher, status : ${teachers}">

                        <td th:text="${currentPage * pageSize + status.index + 1}">
                            1
                        </td>

                        <td th:text="${teacher.username}">
                            username
                        </td>

                        <td th:text="${teacher.fullName != null
                                      and !#strings.isEmpty(teacher.fullName)
                                      ? teacher.fullName
                                      : 'Chưa cập nhật'}">
                            Nguyễn Văn A
                        </td>

                        <td th:text="${teacher.email}">
                            email@example.com
                        </td>

                        <td>
                            <span th:if="${teacher.enabled}"
                                  class="badge bg-success">
                                Hoạt động
                            </span>

                            <span th:unless="${teacher.enabled}"
                                  class="badge bg-danger">
                                Bị khóa
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mb-0">

                    <!-- Trang trước -->
                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/teachers(
                               page=${currentPage - 1},
                               size=${pageSize},
                               keyword=${keyword}
                           )}">
                            Trước
                        </a>
                    </li>

                    <!-- Các số trang -->
                    <li class="page-item"
                        th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${pageNumber == currentPage} ? 'active'">

                        <a class="page-link"
                           th:href="@{/admin/teachers(
                               page=${pageNumber},
                               size=${pageSize},
                               keyword=${keyword}
                           )}"
                           th:text="${pageNumber + 1}">
                            1
                        </a>
                    </li>

                    <!-- Trang sau -->
                    <li class="page-item"
                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/teachers(
                               page=${currentPage + 1},
                               size=${pageSize},
                               keyword=${keyword}
                           )}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>

</div>

</body>
</html>
