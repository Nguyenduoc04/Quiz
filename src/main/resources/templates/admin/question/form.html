<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Cập Nhật Câu Hỏi - Admin' : 'Tạo Mới Câu Hỏi - Admin'">Form Câu Hỏi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header(${isEdit ? 'Cập nhật câu hỏi' : 'Tạo mới câu hỏi'}, 'Điền thông tin và cấu hình các phương án trả lời')}"></div>

    <main class="admin-content p-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h4 class="fw-bold mb-1" th:text="${isEdit} ? 'Cập Nhật Câu Hỏi' : 'Tạo Câu Hỏi Mới'">Form Câu Hỏi</h4>
                    </div>
                    <a th:href="@{/admin/questions}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <form th:action="${isEdit} ? @{/admin/questions/{id}/edit(id=${questionDTO.id})} : @{/admin/questions/create}"
                      th:object="${questionDTO}" method="post">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="categoryId" class="form-label fw-semibold">Danh mục câu hỏi <span class="text-danger">*</span></label>
                            <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="difficultyLevel" class="form-label fw-semibold">Mức độ khó</label>
                            <select id="difficultyLevel" th:field="*{difficultyLevel}" class="form-select">
                                <option value="EASY">Dễ</option>
                                <option value="MEDIUM">Trung bình</option>
                                <option value="HARD">Khó</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="score" class="form-label fw-semibold">Điểm số</label>
                            <input type="number" step="0.5" id="score" th:field="*{score}" class="form-control" value="1.0" min="0.5" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-semibold">Nội dung câu hỏi <span class="text-danger">*</span></label>
                        <textarea id="content" th:field="*{content}" class="form-control" rows="3" placeholder="Nhập câu hỏi..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Các phương án lựa chọn <span class="text-danger">*</span></label>
                        <div class="vstack gap-2">
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" type="checkbox" th:field="*{answers[0].correct}">
                                    <span class="ms-2 fw-bold text-primary">A.</span>
                                </div>
                                <input type="text" th:field="*{answers[0].content}" class="form-control" placeholder="Đáp án A" required>
                            </div>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" type="checkbox" th:field="*{answers[1].correct}">
                                    <span class="ms-2 fw-bold text-primary">B.</span>
                                </div>
                                <input type="text" th:field="*{answers[1].content}" class="form-control" placeholder="Đáp án B" required>
                            </div>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" type="checkbox" th:field="*{answers[2].correct}">
                                    <span class="ms-2 fw-bold text-primary">C.</span>
                                </div>
                                <input type="text" th:field="*{answers[2].content}" class="form-control" placeholder="Đáp án C (tùy chọn)">
                            </div>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" type="checkbox" th:field="*{answers[3].correct}">
                                    <span class="ms-2 fw-bold text-primary">D.</span>
                                </div>
                                <input type="text" th:field="*{answers[3].content}" class="form-control" placeholder="Đáp án D (tùy chọn)">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="explanation" class="form-label fw-semibold">Giải thích chi tiết</label>
                        <textarea id="explanation" th:field="*{explanation}" class="form-control" rows="2" placeholder="Giải thích đáp án..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/admin/questions}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Lưu lại</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
