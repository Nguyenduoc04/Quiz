<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Câu Hỏi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header('Chi tiết câu hỏi', 'Thông tin câu hỏi và danh sách đáp án')}"></div>

    <main class="admin-content p-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h4 class="fw-bold mb-1">📖 Câu Hỏi #<span th:text="${question.id}">1</span></h4>
                    </div>
                    <a th:href="@{/admin/questions}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <div class="mb-4">
                    <h6 class="text-muted fw-semibold mb-2">Nội dung câu hỏi:</h6>
                    <div class="p-3 rounded bg-light fw-semibold text-dark fs-5" th:text="${question.content}">Nội dung câu hỏi</div>
                </div>

                <div class="row mb-4 g-3 p-3 rounded bg-light">
                    <div class="col-md-4">
                        <span class="text-muted small">Danh mục:</span>
                        <span class="fw-bold d-block text-primary" th:text="${question.categoryName}">Danh mục</span>
                    </div>
                    <div class="col-md-4">
                        <span class="text-muted small">Điểm số:</span>
                        <span class="fw-bold d-block text-dark" th:text="${question.score}">1.0</span>
                    </div>
                    <div class="col-md-4">
                        <span class="text-muted small">Người tạo:</span>
                        <span class="fw-bold d-block text-dark" th:text="${question.createdByName}">Admin</span>
                    </div>
                </div>

                <div class="mb-4">
                    <h6 class="text-muted fw-semibold mb-3">Các phương án lựa chọn:</h6>
                    <div class="vstack gap-2">
                        <div th:each="ans, stat : ${question.answers}"
                             class="p-3 rounded border d-flex justify-content-between align-items-center"
                             th:style="${ans.correct} ? 'background-color: #e8f5e9; border-color: #c8e6c9 !important; color: #2e7d32;' : ''">
                            <div>
                                <span class="fw-bold me-2" th:text="${stat.index == 0 ? 'A.' : (stat.index == 1 ? 'B.' : (stat.index == 2 ? 'C.' : 'D.'))}">A.</span>
                                <span th:text="${ans.content}">Nội dung đáp án</span>
                            </div>
                            <span th:if="${ans.correct}" class="badge bg-success">Đáp án đúng</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/admin/questions}" class="btn btn-outline-secondary">Quay lại</a>
                    <a th:href="@{/admin/questions/{id}/edit(id=${question.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil me-1"></i> Chỉnh sửa
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
