<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ngân Hàng Câu Hỏi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header('Ngân hàng câu hỏi', 'Quản lý danh sách câu hỏi trong hệ thống')}"></div>

    <main class="admin-content p-4">
        <!-- Notification Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold">Danh Sách Câu Hỏi</h4>
                        <p class="text-muted mb-0">Tổng số: <strong th:text="${totalItems}">0</strong> câu hỏi</p>
                    </div>
                    <a th:href="@{/admin/questions/create}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Tạo câu hỏi mới
                    </a>
                </div>

                <!-- Form tìm kiếm -->
                <form th:action="@{/admin/questions}" method="get" class="row g-2 mb-4">
                    <div class="col-md-5">
                        <input type="text" name="keyword" class="form-control" placeholder="Tìm theo nội dung câu hỏi..." th:value="${keyword}">
                    </div>
                    <div class="col-md-3">
                        <select name="categoryId" class="form-select">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select name="difficulty" class="form-select">
                            <option value="">-- Mức độ --</option>
                            <option value="EASY" th:selected="${selectedDifficulty == 'EASY'}">Dễ</option>
                            <option value="MEDIUM" th:selected="${selectedDifficulty == 'MEDIUM'}">Trung bình</option>
                            <option value="HARD" th:selected="${selectedDifficulty == 'HARD'}">Khó</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search me-1"></i> Tìm</button>
                        <a th:href="@{/admin/questions}" class="btn btn-outline-secondary">Đặt lại</a>
                    </div>
                </form>

                <!-- Bảng danh sách câu hỏi -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th>Nội dung câu hỏi</th>
                            <th>Danh mục</th>
                            <th>Mức độ</th>
                            <th class="text-center">Điểm</th>
                            <th>Người tạo</th>
                            <th style="width: 140px;" class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="q, stat : ${questions}">
                            <td th:text="${currentPage * pageSize + stat.index + 1}">1</td>
                            <td>
                                <a th:href="@{/admin/questions/{id}(id=${q.id})}" class="text-decoration-none fw-semibold text-dark"
                                   th:text="${#strings.abbreviate(q.content, 70)}">Nội dung câu hỏi</a>
                            </td>
                            <td><span class="badge bg-info text-dark" th:text="${q.categoryName}">Java</span></td>
                            <td>
                                <span th:if="${q.difficultyLevel.name() == 'EASY'}" class="badge bg-success">Dễ</span>
                                <span th:if="${q.difficultyLevel.name() == 'MEDIUM'}" class="badge bg-warning text-dark">Trung bình</span>
                                <span th:if="${q.difficultyLevel.name() == 'HARD'}" class="badge bg-danger">Khó</span>
                            </td>
                            <td class="text-center fw-bold" th:text="${q.score}">1.0</td>
                            <td class="text-muted" th:text="${q.createdByName}">Admin</td>
                            <td class="text-center">
                                <a th:href="@{/admin/questions/{id}(id=${q.id})}" class="btn btn-sm btn-outline-primary me-1" title="Xem">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/admin/questions/{id}/edit(id=${q.id})}" class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/questions/{id}/delete(id=${q.id})}" method="post" class="d-inline"
                                      th:onsubmit="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(questions)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                Không tìm thấy câu hỏi nào.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/questions(page=${currentPage - 1}, keyword=${keyword}, categoryId=${selectedCategoryId}, difficulty=${selectedDifficulty})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/questions(page=${i}, keyword=${keyword}, categoryId=${selectedCategoryId}, difficulty=${selectedDifficulty})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/questions(page=${currentPage + 1}, keyword=${keyword}, categoryId=${selectedCategoryId}, difficulty=${selectedDifficulty})}">Sau</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
