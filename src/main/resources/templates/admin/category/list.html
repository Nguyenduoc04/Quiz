<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục Câu hỏi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="admin-main">
    <div th:replace="~{fragments/header :: header('Danh mục câu hỏi', 'Quản lý danh mục câu hỏi toàn hệ thống')}"></div>

    <main class="admin-content p-4">
        <!-- Notification Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold">Danh Sách Danh Mục</h4>
                        <p class="text-muted mb-0">Tổng số: <strong th:text="${totalItems}">0</strong> danh mục</p>
                    </div>
                    <a th:href="@{/admin/categories/create}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Tạo mới danh mục
                    </a>
                </div>

                <!-- Form tìm kiếm -->
                <form th:action="@{/admin/categories}" method="get" class="row g-2 mb-4">
                    <div class="col-md-9">
                        <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên hoặc mô tả danh mục..." th:value="${keyword}">
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-secondary w-100">
                            <i class="bi bi-search me-1"></i> Tìm
                        </button>
                        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Đặt lại</a>
                    </div>
                </form>

                <!-- Bảng danh mục -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Người tạo</th>
                            <th class="text-center">Số câu hỏi</th>
                            <th style="width: 150px;" class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat, stat : ${categories}">
                            <td th:text="${currentPage * pageSize + stat.index + 1}">1</td>
                            <td class="fw-semibold" th:text="${cat.name}">Tên danh mục</td>
                            <td class="text-muted" th:text="${#strings.abbreviate(cat.description, 60)}">Mô tả danh mục</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${cat.createdByName}">Admin</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-secondary rounded-pill" th:text="${cat.questionCount}">0</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" class="d-inline"
                                      th:onsubmit="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                Không tìm thấy danh mục nào.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/categories(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/categories(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </main>
</div>

<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
