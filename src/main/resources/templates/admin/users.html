<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .navbar-admin { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .card-custom { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-role { font-size: 0.78rem; padding: 0.3em 0.7em; border-radius: 12px; }
        .badge-admin { background-color: #fde8e8; color: #dc3545; border: 1px solid #f5c6cb; }
        .badge-teacher { background-color: #e3f2fd; color: #0d6efd; border: 1px solid #b6d4fe; }
        .badge-pending { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-user { background-color: #e8f5e9; color: #198754; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

<!-- Admin Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-admin shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>Admin Dashboard
        </a>
        <div class="d-flex align-items-center text-white gap-3">
            <span class="small">Xin chào, <strong th:text="${#authentication.name}">Admin</strong></span>
            <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm">Về Trang chủ</a>
            <form th:action="@{/auth/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">👥 Quản Lý Tài Khoản Người Dùng</h3>
            <p class="text-muted small mb-0">Duyệt giáo viên và quản lý danh sách tài khoản trong hệ thống</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Quay lại Dashboard
        </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Table Users -->
    <div class="card card-custom">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Họ và Tên</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Vai Trò (Roles)</th>
                            <th class="text-end pe-3">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="ps-3 fw-bold" th:text="${u.id}">1</td>
                            <td th:text="${u.fullName}">Nguyễn Văn A</td>
                            <td><code th:text="${u.username}">username</code></td>
                            <td th:text="${u.email}">email@example.com</td>
                            <td>
                                <span th:each="r : ${u.roles}"
                                      class="badge badge-role me-1"
                                      th:classappend="${r.name == 'ROLE_ADMIN'} ? 'badge-admin' :
                                                      (${r.name == 'ROLE_TEACHER'} ? 'badge-teacher' :
                                                      (${r.name == 'ROLE_PENDING_TEACHER'} ? 'badge-pending' : 'badge-user'))"
                                      th:text="${r.name == 'ROLE_PENDING_TEACHER' ? '⌛ Chờ duyệt Giáo viên' : r.name}">
                                    ROLE_USER
                                </span>
                            </td>
                            <td class="text-end pe-3">
                                <div class="d-flex justify-content-end gap-2">
                                    <!-- Nút Duyệt / Từ chối Giáo viên (Nếu user có ROLE_PENDING_TEACHER) -->
                                    <th:block th:each="r : ${u.roles}" th:if="${r.name == 'ROLE_PENDING_TEACHER'}">
                                        <form th:action="@{/admin/users/{id}/approve-teacher(id=${u.id})}" method="post" class="m-0">
                                            <button type="submit" class="btn btn-success btn-sm py-1 px-2"
                                                    onclick="return confirm('Bạn có chắc chắn muốn duyệt tài khoản này thành Giáo viên?')">
                                                <i class="bi bi-check-circle me-1"></i> Duyệt
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/users/{id}/reject-teacher(id=${u.id})}" method="post" class="m-0">
                                            <button type="submit" class="btn btn-outline-warning btn-sm py-1 px-2"
                                                    onclick="return confirm('Bạn có chắc chắn muốn từ chối yêu cầu Đăng ký Giáo viên?')">
                                                <i class="bi bi-x-circle me-1"></i> Từ chối
                                            </button>
                                        </form>
                                    </th:block>

                                    <!-- Nút Xóa tài khoản (Không cho phép tự xóa Admin hiện tại) -->
                                    <form th:if="${u.username != #authentication.name}"
                                          th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                                          method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-danger btn-sm py-1 px-2"
                                                onclick="return confirm('⚠️ Bạn có chắc chắn muốn xóa vĩnh viễn tài khoản này?')">
                                            <i class="bi bi-trash"></i> Xóa
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
