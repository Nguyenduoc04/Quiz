<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng Câu Hỏi - Quiz CodeGym</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .main-container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .card-custom { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07); border: none; }
        .btn-gradient { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 25px; font-weight: 500; }
        .btn-gradient:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>

<!-- Top Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container">

    <!-- Alert thông báo -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Content Card -->
    <div class="card-custom">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1" style="color: #1a1a2e;">📚 Ngân Hàng Câu Hỏi</h2>
                <p class="text-muted mb-0">Quản lý câu hỏi trong hệ thống. Tổng số: <strong th:text="${totalItems}">0</strong> câu hỏi</p>
            </div>
            <a th:href="@{/teacher/questions/create}" class="btn btn-gradient px-4 py-2">
                <i class="bi bi-plus-circle me-1"></i> Tạo câu hỏi mới
            </a>
        </div>

        <!-- Form tìm kiếm -->
        <form th:action="@{/teacher/questions}" method="get" class="row g-2 mb-4">
            <div class="col-md-9">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="keyword" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm theo nội dung câu hỏi..." th:value="${keyword}">
                </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100 rounded-3" style="background-color: #667eea; border: none;">Tìm kiếm</button>
                <a th:href="@{/teacher/questions}" class="btn btn-outline-secondary rounded-3">Đặt lại</a>
            </div>
        </form>

        <!-- Bảng danh sách câu hỏi -->
        <div class="table-responsive">
            <table class="table table-hover align-middle border-0">
                <thead style="background-color: #f8f9fa;">
                <tr>
                    <th style="width: 50px;">STT</th>
                    <th>Nội dung câu hỏi</th>
                    <th>Danh mục</th>
                    <th>Mức độ</th>
                    <th class="text-center">Điểm</th>
                    <th>Người tạo</th>
                    <th style="width: 140px;" class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="q, stat : ${questions}">
                    <td th:text="${currentPage * pageSize + stat.index + 1}">1</td>
                    <td>
                        <a th:href="@{/teacher/questions/{id}(id=${q.id})}" class="text-decoration-none fw-semibold text-dark"
                           th:text="${#strings.abbreviate(q.content, 75)}">Nội dung câu hỏi</a>
                    </td>
                    <td>
                        <span class="badge" style="background-color: #e8f0fe; color: #3949ab; border: 1px solid #c5cae9;" th:text="${q.categoryName}">Java</span>
                    </td>
                    <td>
                        <span th:if="${q.difficultyLevel.name() == 'EASY'}" class="badge bg-success-subtle text-success border border-success-subtle">Dễ</span>
                        <span th:if="${q.difficultyLevel.name() == 'MEDIUM'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">Trung bình</span>
                        <span th:if="${q.difficultyLevel.name() == 'HARD'}" class="badge bg-danger-subtle text-danger border border-danger-subtle">Khó</span>
                    </td>
                    <td class="text-center fw-bold text-dark" th:text="${q.score}">1.0</td>
                    <td class="text-muted" th:text="${q.createdByName}">Giáo viên A</td>
                    <td class="text-center">
                        <a th:href="@{/teacher/questions/{id}(id=${q.id})}" class="btn btn-sm btn-light border me-1" title="Xem chi tiết">
                            <i class="bi bi-eye text-primary"></i>
                        </a>
                        <a th:href="@{/teacher/questions/{id}/edit(id=${q.id})}" class="btn btn-sm btn-light border me-1" title="Sửa">
                            <i class="bi bi-pencil text-warning"></i>
                        </a>
                        <form th:action="@{/teacher/questions/{id}/delete(id=${q.id})}" method="post" class="d-inline"
                              th:onsubmit="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này?');">
                            <button type="submit" class="btn btn-sm btn-light border" title="Xóa">
                                <i class="bi bi-trash text-danger"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(questions)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Chưa có câu hỏi nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Phân trang -->
        <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/teacher/questions(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/teacher/questions(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/teacher/questions(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
