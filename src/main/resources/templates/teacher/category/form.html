<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${isEdit} ? 'Cập Nhật Danh Mục' : 'Tạo Mới Danh Mục'">
        Danh mục
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        .main-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card-custom {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            border: none;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 500;
        }

        .btn-gradient:hover {
            color: white;
            opacity: 0.92;
        }
    </style>
</head>

<body>

<!-- Navbar chung -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container">

    <!-- Error message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4"
         role="alert">

        <i class="bi bi-exclamation-triangle-fill me-2"></i>

        <span th:text="${errorMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div class="card-custom">

        <h3 class="fw-bold mb-3"
            style="color: #1a1a2e;"
            th:text="${isEdit}
                     ? '✏️ Cập Nhật Danh Mục'
                     : '➕ Tạo Danh Mục Mới'">
            Danh mục
        </h3>

        <p class="text-muted mb-4"
           th:text="${isEdit}
                    ? 'Chỉnh sửa thông tin danh mục câu hỏi.'
                    : 'Điền thông tin chi tiết danh mục bên dưới.'">
        </p>

        <form th:action="${isEdit}
                         ? @{/teacher/categories/{id}/edit(id=${categoryDTO.id})}
                         : @{/teacher/categories/create}"
              th:object="${categoryDTO}"
              method="post">

            <div class="mb-3">

                <label for="name"
                       class="form-label fw-semibold">
                    Tên danh mục
                    <span class="text-danger">*</span>
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="Ví dụ: Lập trình Java Core"
                       maxlength="100"
                       required>

            </div>

            <div class="mb-4">

                <label for="description"
                       class="form-label fw-semibold">
                    Mô tả danh mục
                </label>

                <textarea id="description"
                          th:field="*{description}"
                          class="form-control"
                          rows="4"
                          placeholder="Nhập mô tả ngắn cho danh mục..."
                          maxlength="500"></textarea>

                <div class="form-text">
                    Tối đa 500 ký tự.
                </div>

            </div>

            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/teacher/categories}"
                   class="btn btn-outline-secondary rounded-pill px-4">
                    Hủy bỏ
                </a>

                <button type="submit"
                        class="btn btn-gradient rounded-pill px-4">

                    <i class="bi bi-save me-1"></i>

                    <span th:text="${isEdit}
                                   ? 'Cập nhật'
                                   : 'Lưu danh mục'">
                        Lưu
                    </span>

                </button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
