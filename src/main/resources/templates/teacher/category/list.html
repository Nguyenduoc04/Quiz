<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Danh mục câu hỏi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Tiêu đề -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">
                Danh mục câu hỏi
            </h2>

            <p class="text-muted mb-0">
                Quản lý các danh mục câu hỏi của bạn
            </p>
        </div>

        <a th:href="@{/teacher/categories/create}"
           class="btn btn-primary">
            + Thêm danh mục
        </a>
    </div>


    <!-- Thông báo thành công -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show">

        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>


    <!-- Thông báo lỗi -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show">

        <span th:text="${errorMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>


    <!-- Search -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <form th:action="@{/teacher/categories}"
                  method="get"
                  class="row g-2">

                <div class="col-md-8">

                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Tìm theo tên hoặc mô tả..."
                           th:value="${keyword}">

                </div>

                <div class="col-md-2 d-grid">

                    <button type="submit"
                            class="btn btn-primary">
                        Tìm kiếm
                    </button>

                </div>

                <div class="col-md-2 d-grid">

                    <a th:href="@{/teacher/categories}"
                       class="btn btn-outline-secondary">
                        Đặt lại
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- Tổng số -->
    <div class="mb-3 text-muted">

        Tổng số:

        <strong th:text="${totalItems}">
            0
        </strong>

        danh mục

    </div>


    <!-- Table -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th class="ps-3">STT</th>
                        <th>Tên danh mục</th>
                        <th>Mô tả</th>
                        <th class="text-center">Số câu hỏi</th>
                        <th>Ngày tạo</th>
                        <th class="text-center">Thao tác</th>
                    </tr>

                    </thead>

                    <tbody>

                    <!-- Không có dữ liệu -->
                    <tr th:if="${#lists.isEmpty(categories)}">

                        <td colspan="6"
                            class="text-center text-muted py-5">

                            Chưa có danh mục nào.

                        </td>

                    </tr>


                    <!-- Danh sách category -->
                    <tr th:each="category, stat : ${categories}">

                        <td class="ps-3"
                            th:text="${currentPage * pageSize + stat.index + 1}">
                            1
                        </td>

                        <td>
                            <strong th:text="${category.name}">
                                Java
                            </strong>
                        </td>

                        <td class="text-muted"
                            th:text="${category.description}">
                            Mô tả
                        </td>

                        <td class="text-center">

                            <span class="badge text-bg-secondary"
                                  th:text="${category.questionCount}">
                                0
                            </span>

                        </td>

                        <td th:text="${#temporals.format(category.createdAt, 'dd/MM/yyyy HH:mm')}">
                            01/01/2026
                        <td class="text-center">

                            <div class="d-flex justify-content-center gap-2">

                                <a th:href="@{/teacher/categories/{id}/edit(id=${category.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Sửa
                                </a>

                                <form th:action="@{/teacher/categories/{id}/delete(id=${category.id})}"
                                      method="post"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Xóa
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Pagination -->
    <nav class="mt-4"
         th:if="${totalPages > 1}">

        <ul class="pagination justify-content-center">

            <!-- Previous -->
            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/teacher/categories(
                        page=${currentPage - 1},
                        size=${pageSize},
                        keyword=${keyword}
                   )}">
                    Trước
                </a>

            </li>


            <!-- Page numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">

                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/teacher/categories(
                        page=${i},
                        size=${pageSize},
                        keyword=${keyword}
                   )}">
                    1
                </a>

            </li>


            <!-- Next -->
            <li class="page-item"
                th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/teacher/categories(
                        page=${currentPage + 1},
                        size=${pageSize},
                        keyword=${keyword}
                   )}">
                    Sau
                </a>

            </li>

        </ul>

    </nav>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
