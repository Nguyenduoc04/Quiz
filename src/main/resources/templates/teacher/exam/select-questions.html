<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chọn Câu Hỏi Cho Đề Thi - Quiz CodeGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .main-container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
        .card-custom { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07); border: none; }
    </style>
</head>
<body>

<!-- Top Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-container">
    <!-- Filter Category -->
    <div class="card-custom mb-4">
        <h4 class="fw-bold mb-3" style="color: #1a1a2e;">Chọn câu hỏi cho: <span th:text="${exam.title}" style="color: #667eea;">Đề thi</span></h4>
        <form th:action="@{/teacher/exams/{id}/questions(id=${exam.id})}" method="get" class="row g-2 align-items-center">
            <div class="col-md-9">
                <select name="categoryId" class="form-select">
                    <option value="">-- Tất cả danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-funnel me-1"></i> Lọc câu hỏi</button>
                <a th:href="@{/teacher/exams/{id}/questions(id=${exam.id})}" class="btn btn-outline-secondary">Đặt lại</a>
            </div>
        </form>
    </div>

    <!-- Question Checkbox List -->
    <div class="card-custom">
        <form th:action="@{/teacher/exams/{id}/questions(id=${exam.id})}" method="post">
            <div class="list-group mb-4">
                <label th:each="q : ${questions}" class="list-group-item d-flex gap-3 py-3 cursor-pointer">
                    <input class="form-check-input flex-shrink-0" type="checkbox" name="questionIds" th:value="${q.id}" th:checked="${selectedQuestionIds != null and selectedQuestionIds.contains(q.id)}" style="font-size: 1.2em;">
                    <span class="pt-1">
                        <strong class="d-block text-dark mb-1" th:text="${q.content}">Nội dung câu hỏi?</strong>
                        <small class="text-muted" th:text="${q.category != null ? q.category.name : ''}">Danh mục</small>
                    </span>
                </label>
                <div th:if="${#lists.isEmpty(questions)}" class="text-center py-4 text-muted">
                    Không tìm thấy câu hỏi phù hợp.
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/teacher/exams}" class="btn btn-outline-secondary rounded-pill px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="bi bi-check-circle me-1"></i> Lưu danh sách câu hỏi</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
