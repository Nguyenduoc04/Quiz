<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đề thi - Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        nav { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 2px 12px rgba(102, 126, 234, 0.4); }
        .sidebar-logo a { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; color: #ffffff; text-decoration: none; }
        .sidebar-logo i { font-size: 28px; color: #f59e0b; }
        .user-dropdown { position: relative; display: inline-block; }
        .user-dropdown-btn { background: rgba(255, 255, 255, 0.18); color: white; border: 1px solid rgba(255, 255, 255, 0.35); padding: 0.5rem 1rem; border-radius: 25px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; padding-top: 8px; min-width: 210px; z-index: 1000; }
        .dropdown-menu-content { background-color: white; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); border-radius: 12px; overflow: hidden; }
        .user-dropdown:hover .dropdown-menu { display: block; }
        .dropdown-item { color: #333; padding: 0.75rem 1.2rem; text-decoration: none; display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; font-weight: 500; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-header h2 { color: #1a1a2e; font-size: 1.6rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn-create { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 0.65rem 1.3rem; border-radius: 25px; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        .filter-card { background: white; border-radius: 16px; padding: 1.25rem 1.5rem; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05); margin-bottom: 1.5rem; }
        .filter-form { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .form-input { padding: 0.55rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; outline: none; min-width: 220px; }
        .btn-filter { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 0.55rem 1.1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .table-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); overflow: hidden; }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; }
        .custom-table th { background: #f8fafc; color: #475569; font-size: 0.85rem; text-transform: uppercase; padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; }
        .custom-table td { padding: 1rem 1.25rem; border-bottom: 1px solid #f1f5f9; font-size: 0.92rem; color: #334155; vertical-align: middle; }
        .badge { display: inline-flex; align-items: center; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .badge-active { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .badge-draft { background: #fff8e1; color: #b78103; border: 1px solid #ffe0b2; }
        .action-btns { display: flex; gap: 0.4rem; justify-content: center; }
        .btn-action { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.95rem; }
        .btn-questions { background: #f0fdf4; color: #16a34a; }
        .btn-edit { background: #eff6ff; color: #2563eb; }
        .btn-delete { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
<nav>
    <div class="sidebar-logo">
        <a th:href="@{/dashboard}"><i class="bi bi-patch-question-fill"></i><span>Quiz CodeGym</span></a>
    </div>
    <div class="nav-right" th:if="${isLoggedIn}">
        <div class="user-dropdown">
            <button class="user-dropdown-btn">👤 Xin chào, <strong th:text="${username}">User</strong> ▾</button>
            <div class="dropdown-menu">
                <div class="dropdown-menu-content">
                    <form th:action="@{/auth/logout}" method="post" style="margin:0"><button type="submit" class="dropdown-item" style="color: #e74c3c;">🚪 Đăng xuất</button></form>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2><i class="bi bi-journal-text" style="color: #667eea;"></i> Quản lý Đề thi</h2>
        <a th:href="@{/exams/create}" class="btn-create"><i class="bi bi-plus-lg"></i> Tạo đề thi mới</a>
    </div>

    <div class="filter-card">
        <form th:action="@{/exams}" method="get" class="filter-form">
            <input type="text" name="createdBy" class="form-input" placeholder="Tìm theo username người tạo..." th:value="${createdBy}">
            <label><input type="checkbox" name="myExamsOnly" value="true" th:checked="${myExamsOnly}"> Chỉ hiện đề thi của tôi</label>
            <button type="submit" class="btn-filter"><i class="bi bi-funnel"></i> Lọc</button>
            <a th:href="@{/exams}" style="color: #64748b; text-decoration: none; font-size: 0.88rem;">Đặt lại</a>
        </form>
    </div>

    <div class="table-card">
        <table class="custom-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Thông tin bài thi</th>
                <th>Thời gian</th>
                <th>Trạng thái</th>
                <th>Người tạo</th>
                <th style="text-align: center;">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exam : ${exams}">
                <td th:text="${'#' + exam.id}">#1</td>
                <td>
                    <strong th:text="${exam.title}">Đề thi Java Core</strong><br>
                    <small style="color: #64748b;" th:text="${exam.description}">Mô tả...</small>
                </td>
                <td th:text="${exam.durationMinutes + ' phút'}">45 phút</td>
                <td>
                    <span class="badge" th:classappend="${exam.status.name() == 'ACTIVE' ? 'badge-active' : 'badge-draft'}" th:text="${exam.status}">ACTIVE</span>
                </td>
                <td th:text="${exam.createdBy}">admin</td>
                <td>
                    <div class="action-btns">
                        <a th:href="@{/exams/{id}/questions(id=${exam.id})}" class="btn-action btn-questions" title="Chọn câu hỏi"><i class="bi bi-list-check"></i></a>
                        <a th:href="@{/exams/edit/{id}(id=${exam.id})}" class="btn-action btn-edit" title="Chỉnh sửa"><i class="bi bi-pencil-square"></i></a>
                        <a th:href="@{/exams/delete/{id}(id=${exam.id})}" class="btn-action btn-delete" title="Xóa" onclick="return confirm('Xóa bài thi này?')"><i class="bi bi-trash"></i></a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
