<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Form Đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        nav { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.8rem 2rem; color: white; display: flex; justify-content: space-between; }
        .container { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem; }
        .form-card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); }
        .form-group { margin-bottom: 1.4rem; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
        .form-control { width: 100%; padding: 0.65rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .btn-submit { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 0.65rem 1.6rem; border-radius: 25px; font-weight: 600; border: none; cursor: pointer; }
    </style>
</head>
<body>
<nav>
    <div style="font-weight: 700; font-size: 20px;">Quiz CodeGym</div>
</nav>
<div class="container">
    <h2 style="margin-bottom: 1.5rem;" th:text="${pageTitle}">Tạo Đề thi</h2>
    <div class="form-card">
        <form th:action="${exam.id == null ? '/exams/create' : '/exams/edit/' + exam.id}" th:object="${exam}" method="post">
            <div class="form-group">
                <label class="form-label">Tên đề thi *</label>
                <input type="text" th:field="*{title}" class="form-control" required placeholder="Nhập tên đề thi">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Thời gian (Phút) *</label>
                    <input type="number" th:field="*{durationMinutes}" class="form-control" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Trạng thái *</label>
                    <select th:field="*{status}" class="form-control">
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                <a th:href="@{/exams}" style="padding: 0.65rem 1.4rem; color: #64748b; text-decoration: none;">Hủy</a>
                <button type="submit" class="btn-submit">Lưu lại</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
