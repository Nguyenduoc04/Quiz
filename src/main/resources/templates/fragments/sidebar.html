<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <aside th:fragment="sidebar" class="admin-sidebar d-flex flex-column">

        <!-- Logo -->
        <div class="sidebar-logo">
            <a th:href="@{/admin/dashboard}" class="text-decoration-none text-white">

                <i class="bi bi-patch-question-fill"></i>
                <span>Quiz CodeGym</span>
            </a>
        </div>

        <!-- Menu -->
        <nav class="sidebar-menu flex-grow-1">

            <p class="menu-title">QUẢN TRỊ HỆ THỐNG</p>

            <a th:href="@{/dashboard}" class="sidebar-link">

                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/admin/dashboard}" class="sidebar-link">

                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/admin/students}" class="sidebar-link">

                <i class="bi bi-mortarboard"></i>
                <span>Quản lý học viên</span>
            </a>

            <a th:href="@{/admin/teachers}" class="sidebar-link">

                <i class="bi bi-person-workspace"></i>
                <span>Quản lý giáo viên</span>
            </a>

            <a th:href="@{/admin/teachers/pending}" class="sidebar-link">

                <i class="bi bi-person-check"></i>
                <span>Duyệt giáo viên</span>
            </a>

            <a th:href="@{/admin/categories}" class="sidebar-link">
                <i class="bi bi-folder2-open"></i>
                <span>Quản lý danh mục</span>
            </a>

            <a th:href="@{/admin/questions}" class="sidebar-link">
                <i class="bi bi-question-square"></i>
                <span>Ngân hàng câu hỏi</span>
            </a>

            <a th:href="@{/admin/exams}" class="sidebar-link">
                <i class="bi bi-journal-text"></i>
                <span>Quản lý đề thi</span>
            </a>

            <div class="mt-4 pt-3 border-top border-secondary">
                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="sidebar-link border-0 bg-transparent text-danger w-100 text-start">
                        <i class="bi bi-box-arrow-right text-danger"></i>
                        <span>Đăng xuất</span>
                    </button>
                </form>
            </div>

        </nav>

    </aside>

</body>

</html>
