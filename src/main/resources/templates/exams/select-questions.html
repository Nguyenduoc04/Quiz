<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chọn câu hỏi cho đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
        nav { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.8rem 2rem; color: white; display: flex; justify-content: space-between; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .question-item { padding: 0.8rem 0; border-bottom: 1px solid #f1f5f9; display: flex; align-items: flex-start; gap: 0.8rem; }
        .btn-save { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 0.65rem 1.6rem; border-radius: 25px; font-weight: 600; border: none; cursor: pointer; }
    </style>
</head>
<body>
<nav>
    <div style="font-weight: 700; font-size: 20px;">Quiz CodeGym</div>
</nav>
<div class="container">
    <h2>Chọn câu hỏi cho: <span th:text="${exam.title}" style="color: #667eea;">Đề thi</span></h2>

    <!-- Filter Category -->
    <div class="card" style="margin-top: 1rem;">
        <form th:action="@{/admin/exams/{id}/questions(id=${exam.id})}" method="get" style="display: flex; gap: 1rem; align-items: center;">
            <select name="categoryId" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1;">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
            </select>
            <button type="submit" style="padding: 0.5rem 1rem; border-radius: 8px; background: #334155; color: white; border: none;">Lọc</button>
        </form>
    </div>

    <!-- Question Checkbox List -->
    <div class="card">
        <form th:action="@{/admin/exams/{id}/questions(id=${exam.id})}" method="post">
            <div th:each="q : ${questions}" class="question-item">
                <input type="checkbox" name="questionIds" th:value="${q.id}" th:checked="${selectedQuestionIds != null and selectedQuestionIds.contains(q.id)}" style="margin-top: 0.2rem;">
                <div>
                    <strong th:text="${q.content}">Nội dung câu hỏi?</strong>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                <a th:href="@{/admin/exams}" style="padding: 0.65rem 1.4rem; color: #64748b; text-decoration: none;">Hủy</a>
                <button type="submit" class="btn-save">Lưu câu hỏi</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
