<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .error-card { background: white; padding: 3rem 2rem; border-radius: 20px; border: 1px solid #e2e8f0; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .error-code { font-size: 5rem; font-weight: 800; color: #667eea; line-height: 1; margin-bottom: 0.5rem; }
        .error-title { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 0.8rem; }
        .error-desc { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 2rem; }
        .btn-home { background: #667eea; color: white; text-decoration: none; padding: 0.75rem 1.8rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-home:hover { background: #5a67d8; }
    </style>
</head>
<body>
<div class="error-card">
    <i class="bi bi-file-earmark-x-fill" style="font-size: 3.5rem; color: #667eea;"></i>
    <div class="error-code">404</div>
    <h1 class="error-title">Không tìm thấy trang</h1>
    <p class="error-desc">Đường dẫn bạn truy cập không tồn tại hoặc đã bị thay đổi vị trí.</p>
    <a th:href="@{/}" class="btn-home"><i class="bi bi-house"></i> Trở về Trang chủ</a>
</div>
</body>
</html>
