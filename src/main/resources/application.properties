spring.application.name=Quiz
spring.profiles.active=local

# =====================================================
# DATABASE - Gia tri thuc dat trong application-local.properties
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# JWT Configuration - Gia tri thuc dat trong application-local.properties
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =====================================================
# SPRING MAIL (GMAIL SMTP) - Gia tri thuc dat trong application-local.properties
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================
# Load them local config (file nay KHONG commit len git)
# =====================================================
spring.config.import=optional:classpath:application-local.properties

# =====================================================
# THYMELEAF - Disable cache for development
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
